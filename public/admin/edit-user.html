<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Restaurant Admin</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
           <div class="sidebar-header">
    <h2>Restaurant Admin</h2>
    <p>Management Panel</p>
</div>
<nav class="sidebar-nav">
    <a href="/admin/dashboard.html" class="nav-item">
        <span>Dashboard</span>
    </a>
    <a href="/admin/users.html" class="nav-item">
        <span>Users</span>
    </a>
    <a href="/admin/orders.html" class="nav-item">
        <span>Orders</span>
    </a>
    <a href="/admin/menu-items.html" class="nav-item">
        <span>Menu</span>
    </a>
    <a href="/admin/reviews.html" class="nav-item">
        <span>Reviews</span>
    </a>
     <a href="/admin/newsletter.html" class="nav-item">
        <span>Newsletter</span>
    </a>
</nav>
<div class="sidebar-footer">
    <div class="admin-info">
        <div class="admin-avatar" id="adminInitials">AD</div>
                    <div class="admin-details">
                        <p class="admin-name" id="adminName">Admin User</p>
                        <p class="admin-role">Administrator</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>Edit User</h1>
                <div class="header-actions">
                    <a href="/admin/users.html" class="btn btn-secondary">← Back to Users</a>
                </div>
            </header>

            <!-- Edit User Form -->
            <div class="content-section" style="max-width: 600px;">
                <div id="loadingMessage" style="text-align: center; padding: 40px;">
                    Loading user data...
                </div>

                <form id="editUserForm" style="display: none;">
                    <input type="hidden" id="userId">

                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" placeholder="Enter full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" placeholder="user@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">New Password (leave blank to keep current)</label>
                        <input type="password" id="password" name="password" placeholder="Enter new password" minlength="6">
                        <small style="color: #666; font-size: 12px; margin-top: 5px; display: block;">Only fill this if you want to change the password</small>
                    </div>

                    <div class="form-group">
                        <label for="role">Role *</label>
                        <select id="role" name="role" required>
                            <option value="user">User (Customer)</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="isActive" name="isActive" style="width: auto; margin-right: 8px;">
                            Account is active
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Update User</button>
                        <a href="/admin/users.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="admin-script.js"></script>
    <script>
        // Set admin name
        const user = JSON.parse(localStorage.getItem('adminUser') || '{}');
        document.getElementById('adminName').textContent = user.name || 'Admin';

        // Get user ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        if (!userId) {
            alert('No user ID provided');
            window.location.href = '/admin/users.html';
        }

        // Load user data
        async function loadUserData() {
            const token = localStorage.getItem('adminToken');
            
            try {
                const response = await fetch(`/api/users/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const userData = data.data;
                    
                    document.getElementById('userId').value = userData._id;
                    document.getElementById('name').value = userData.name;
                    document.getElementById('email').value = userData.email;
                    document.getElementById('role').value = userData.role;
                    document.getElementById('isActive').checked = userData.isActive;
                    
                    document.getElementById('loadingMessage').style.display = 'none';
                    document.getElementById('editUserForm').style.display = 'block';
                } else {
                    alert('Failed to load user data');
                    window.location.href = '/admin/users.html';
                }
            } catch (error) {
                console.error('Error loading user:', error);
                alert('Error loading user data');
                window.location.href = '/admin/users.html';
            }
        }

        // Handle form submission
        document.getElementById('editUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                role: document.getElementById('role').value,
                isActive: document.getElementById('isActive').checked
            };
            
            // Only include password if it's filled
            const password = document.getElementById('password').value;
            if (password) {
                formData.password = password;
            }
            
            const token = localStorage.getItem('adminToken');
            
            try {
                const response = await fetch(`/api/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('User updated successfully!');
                    setTimeout(() => {
                        window.location.href = '/admin/users.html';
                    }, 1500);
                } else {
                    showToast(data.message || 'Failed to update user', 'error');
                }
            } catch (error) {
                console.error('Error updating user:', error);
                showToast('Error updating user', 'error');
            }
        });

        // Load user data on page load
        loadUserData();
    </script>
</body>
</html>
