<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management - Restaurant Admin</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
           <div class="sidebar-header">
    <h2>Restaurant Admin</h2>
    <p>Management Panel</p>
</div>
<nav class="sidebar-nav">
    <a href="/admin/dashboard.html" class="nav-item">
        <span>Dashboard</span>
    </a>
    <a href="/admin/users.html" class="nav-item">
        <span>Users</span>
    </a>
    <a href="/admin/orders.html" class="nav-item active">
        <span>Orders</span>
    </a>
    <a href="/admin/menu-items.html" class="nav-item">
        <span>Menu</span>
    </a>
     <a href="/admin/reviews.html" class="nav-item">
         <span>Reviews</span>
    </a>
      <a href="/admin/newsletter.html" class="nav-item">
        <span>Newsletter</span>
    </a>
</nav>
<div class="sidebar-footer">
    <div class="admin-info">
        <div class="admin-avatar" id="adminInitials">AD</div>
                    <div class="admin-details">
                        <p class="admin-name" id="adminName">Admin User</p>
                        <p class="admin-role">Administrator</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>Users Management</h1>
                <div class="header-actions">
                    <a href="/admin/add-user.html" class="btn btn-primary">+ Add New User</a>
                </div>
            </header>

            <!-- Search and Filters -->
            <div class="content-section">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search by name or email...">
                </div>
                
                <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                    <select id="roleFilter" style="padding: 10px; border-radius: 8px; border: 2px solid #e0e0e0;">
                        <option value="">All Roles</option>
                        <option value="admin">Admin</option>
                        <option value="user">User</option>
                    </select>
                </div>

                <!-- Users Table -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Joined</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 40px;">
                                    Loading users...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="pagination"></div>
            </div>
        </main>
    </div>
  <script src="config.js"></script>
  <script src="admin-script.js"></script>
<script>
   
    let currentPage = 1;
    let totalPages = 1;
    let searchQuery = '';
    let roleFilter = '';

    // Set admin name
    const user = JSON.parse(localStorage.getItem('adminUser') || '{}');
    document.getElementById('adminName').textContent = user.name || 'Admin';

    // Load users
    async function loadUsers(page = 1) {
        const token = localStorage.getItem('adminToken');
        
        try {
            let url = `${BASE_URL}/api/users?page=${page}&limit=10`;
            if (searchQuery) url += `&search=${searchQuery}`;
            if (roleFilter) url += `&role=${roleFilter}`;
            
            const response = await fetch(url, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            const data = await response.json();
            
            if (data.success) {
                displayUsers(data.data.users);
                setupPagination(data.data.pagination);
            } else {
                showToast('Failed to load users', 'error');
            }
        } catch (error) {
            console.error('Error loading users:', error);
            showToast('Error loading users', 'error');
        }
    }

    function displayUsers(users) {
        const tbody = document.getElementById('usersTable');
        
        if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">No users found</td></tr>';
            return;
        }
        
        tbody.innerHTML = users.map(user => `
            <tr>
                <td><strong>${user.name}</strong></td>
                <td>${user.email}</td>
                <td><span class="badge ${user.role === 'admin' ? 'badge-admin' : 'badge-user'}">${user.role}</span></td>
                <td><span class="badge ${user.isActive ? 'badge-active' : 'badge-inactive'}">${user.isActive ? 'Active' : 'Inactive'}</span></td>
                <td>${formatDate(user.createdAt)}</td>
                <td>
                    <div class="action-buttons">
                        <button class="action-btn btn-edit" onclick="editUser('${user._id}')">Edit</button>
                        <button class="action-btn btn-delete" onclick="deleteUser('${user._id}', '${user.name}')">Delete</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function setupPagination(pagination) {
        currentPage = pagination.page;
        totalPages = pagination.pages;
        
        const paginationEl = document.getElementById('pagination');
        
        if (totalPages <= 1) {
            paginationEl.innerHTML = '';
            return;
        }
        
        let html = '<button onclick="loadUsers(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>First</button>';
        html += '<button onclick="loadUsers(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>Previous</button>';
        
        for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
            html += '<button onclick="loadUsers(' + i + ')" ' + (i === currentPage ? 'class="active"' : '') + '>' + i + '</button>';
        }
        
        html += '<button onclick="loadUsers(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>Next</button>';
        html += '<button onclick="loadUsers(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>Last</button>';
        
        paginationEl.innerHTML = html;
    }

    function editUser(userId) {
        window.location.href = `/admin/edit-user.html?id=${userId}`;
    }

    async function deleteUser(userId, userName) {
        if (!confirmAction(`Are you sure you want to delete user "${userName}"?`)) {
            return;
        }
        
        const token = localStorage.getItem('adminToken');
        
        try {
            const response = await fetch(`${BASE_URL}/api/users/${userId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            const data = await response.json();
            
            if (data.success) {
                showToast('User deleted successfully');
                loadUsers(currentPage);
            } else {
                showToast(data.message || 'Failed to delete user', 'error');
            }
        } catch (error) {
            console.error('Error deleting user:', error);
            showToast('Error deleting user', 'error');
        }
    }

    // Search functionality
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        setTimeout(() => {
            if (searchQuery === e.target.value) {
                loadUsers(1);
            }
        }, 500);
    });

    // Filter functionality
    document.getElementById('roleFilter').addEventListener('change', (e) => {
        roleFilter = e.target.value;
        loadUsers(1);
    });

    // Load users on page load
    loadUsers();
</script>

</body>
</html>
