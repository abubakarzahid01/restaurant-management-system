<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Restaurant Management</title>
    <link rel="stylesheet" href="admin-login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🍽️ Admin Panel</h1>
            <p>Restaurant Management System</p>
        </div>
        <div class="login-body">
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-btn">Login to Dashboard</button>
                <div id="message" class="message"></div>
            </form>
            <div class="back-link">
                <a href="/">← Back to Website</a>
            </div>
        </div>
    </div>
<script src="config.js"></script>
<script src="admin-script.js"></script>
 
 <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const messageEl = document.getElementById('message');

        messageEl.style.display = 'none';

        try {
            const response = await fetch(`${BASE_URL}/api/users/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });

            const data = await response.json();

           if (data.success) {
           if (data.user.role !== 'admin') {
                 messageEl.textContent = 'Access denied. Admin privileges required.';
                 messageEl.className = 'message error';
                 messageEl.style.display = 'block';
            return;
    }

    // Save token and user info
    localStorage.setItem('adminToken', data.token);
    localStorage.setItem('adminUser', JSON.stringify(data.user));


                messageEl.textContent = 'Login successful! Redirecting...';
                messageEl.className = 'message success';
                messageEl.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/admin/dashboard.html';
                }, 1200);
            } else {
                messageEl.textContent = data.message || 'Invalid email or password';
                messageEl.className = 'message error';
                messageEl.style.display = 'block';
            }
        } catch (error) {
            console.error('Error during login:', error);
            messageEl.textContent = 'Error connecting to server. Please try again.';
            messageEl.className = 'message error';
            messageEl.style.display = 'block';
        }
    });
</script>

</body>
</html>
