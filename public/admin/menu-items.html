<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Items - Restaurant Admin</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
           <div class="sidebar-header">
    <h2>Restaurant Admin</h2>
    <p>Management Panel</p>
</div>
<nav class="sidebar-nav">
    <a href="/admin/dashboard.html" class="nav-item">
        <span>Dashboard</span>
    </a>
    <a href="/admin/users.html" class="nav-item">
        <span>Users</span>
    </a>
     <a href="/admin/orders.html" class="nav-item">
         <span>Orders</span>
    </a>
    <a href="/admin/menu-items.html" class="nav-item">
        <span>Menu</span>
    </a>
    <a href="/admin/reviews.html" class="nav-item">
        <span>Reviews</span>
    </a>
      <a href="/admin/newsletter.html" class="nav-item">
        <span>Newsletter</span>
    </a>
</nav>
<div class="sidebar-footer">
    <div class="admin-info">
        <div class="admin-avatar" id="adminInitials">AD</div>
                    <div class="admin-details">
                        <p class="admin-name" id="adminName">Admin User</p>
                        <p class="admin-role">Administrator</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>Menu Items</h1>
                <div class="header-actions">
                    <a href="/admin/add-menu-item.html" class="btn btn-primary">+ Add Menu Item</a>
                </div>
            </header>

            <!-- Search and Filters -->
            <div class="content-section">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search by name...">
                </div>
                
                <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                    <select id="categoryFilter" style="padding: 10px; border-radius: 8px; border: 2px solid #e0e0e0;">
                        <option value="">All Categories</option>
                        <option value="Burger">Burger</option>
                        <option value="Pizza">Pizza</option>
                        <option value="Fries">Fries</option>
                        <option value="Ice-cream">Ice-cream</option>
                        <option value="Coffee">Coffee</option>
                        <option value="Other">Other</option>
                    </select>
                    <select id="availableFilter" style="padding: 10px; border-radius: 8px; border: 2px solid #e0e0e0;">
                        <option value="">All Status</option>
                        <option value="true">Available</option>
                        <option value="false">Unavailable</option>
                    </select>
                </div>

                <!-- Menu Items Table -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Discount</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="menuTable">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 40px;">
                                    Loading menu items...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="pagination"></div>
            </div>
        </main>
    </div>

   <script src="admin-script.js"></script>
<script>
    const BASE_URL = 'https://restaurant-management-system-k8tg.onrender.com';

    let currentPage = 1;
    let totalPages = 1;
    let searchQuery = '';
    let categoryFilter = '';
    let availableFilter = '';

    // Set admin name
    const user = JSON.parse(localStorage.getItem('adminUser') || '{}');
    document.getElementById('adminName').textContent = user.name || 'Admin';

    // Load menu items
    async function loadMenuItems(page = 1) {
        const token = localStorage.getItem('adminToken');
        try {
            let url = `${BASE_URL}/api/menu?page=${page}&limit=10`;
            if (searchQuery) url += `&search=${searchQuery}`;
            if (categoryFilter) url += `&category=${categoryFilter}`;
            if (availableFilter) url += `&available=${availableFilter}`;
            
            const response = await fetch(url, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();

            if (data.success) {
                displayMenuItems(data.data.menuItems);
                setupPagination(data.data.pagination);
            } else {
                showToast('Failed to load menu items', 'error');
            }
        } catch (error) {
            console.error('Error loading menu items:', error);
            showToast('Error loading menu items', 'error');
        }
    }

    function displayMenuItems(items) {
        const tbody = document.getElementById('menuTable');
        if (items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">No menu items found</td></tr>';
            return;
        }
        tbody.innerHTML = items.map(item => `
            <tr>
                <td>
                    <img src="${item.image}" alt="${item.name}" style="width: 60px; height: 60px; border-radius: 8px; object-fit: cover;">
                </td>
                <td><strong>${item.name}</strong><br><small style="color: #666;">${item.description.substring(0, 50)}...</small></td>
                <td><span class="badge" style="background: #E3F2FD; color: #2196F3;">${item.category}</span></td>
                <td><strong>$${item.price.toFixed(2)}</strong></td>
                <td>${item.discount > 0 ? `<span class="badge" style="background: #FFE5E5; color: #FF6B6B;">${item.discount}% OFF</span>` : '-'}</td>
                <td><span class="badge ${item.isAvailable ? 'badge-active' : 'badge-inactive'}">${item.isAvailable ? 'Available' : 'Unavailable'}</span></td>
                <td>
                    <div class="action-buttons">
                        <button class="action-btn btn-edit" onclick="editMenuItem('${item._id}')">Edit</button>
                        <button class="action-btn btn-delete" onclick="deleteMenuItem('${item._id}', '${item.name}')">Delete</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function setupPagination(pagination) {
        currentPage = pagination.page;
        totalPages = pagination.pages;
        const paginationEl = document.getElementById('pagination');
        if (totalPages <= 1) {
            paginationEl.innerHTML = '';
            return;
        }

        let html = '<button onclick="loadMenuItems(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>First</button>';
        html += '<button onclick="loadMenuItems(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>Previous</button>';
        for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
            html += '<button onclick="loadMenuItems(' + i + ')" ' + (i === currentPage ? 'class="active"' : '') + '>' + i + '</button>';
        }
        html += '<button onclick="loadMenuItems(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>Next</button>';
        html += '<button onclick="loadMenuItems(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>Last</button>';
        paginationEl.innerHTML = html;
    }

    function editMenuItem(itemId) {
        window.location.href = `/admin/edit-menu-item.html?id=${itemId}`;
    }

    async function deleteMenuItem(itemId, itemName) {
        if (!confirmAction(`Are you sure you want to delete "${itemName}"?`)) return;

        const token = localStorage.getItem('adminToken');
        try {
            const response = await fetch(`${BASE_URL}/api/menu/${itemId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (data.success) {
                showToast('Menu item deleted successfully');
                loadMenuItems(currentPage);
            } else {
                showToast(data.message || 'Failed to delete menu item', 'error');
            }
        } catch (error) {
            console.error('Error deleting menu item:', error);
            showToast('Error deleting menu item', 'error');
        }
    }

    // Search functionality
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        setTimeout(() => {
            if (searchQuery === e.target.value) loadMenuItems(1);
        }, 500);
    });

    // Filter functionality
    document.getElementById('categoryFilter').addEventListener('change', (e) => {
        categoryFilter = e.target.value;
        loadMenuItems(1);
    });

    document.getElementById('availableFilter').addEventListener('change', (e) => {
        availableFilter = e.target.value;
        loadMenuItems(1);
    });

    loadMenuItems();
</script>

</body>
</html>
