<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - Restaurant Admin</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
           <div class="sidebar-header">
    <h2>Restaurant Admin</h2>
    <p>Management Panel</p>
</div>
<nav class="sidebar-nav">
    <a href="/admin/dashboard.html" class="nav-item">
        <span>Dashboard</span>
    </a>
    <a href="/admin/users.html" class="nav-item">
        <span>Users</span>
    </a>
    <a href="/admin/orders.html" class="nav-item">
        <span>Orders</span>
    </a>
    <a href="/admin/menu-items.html" class="nav-item">
        <span>Menu</span>
    </a>
     <a href="/admin/reviews.html" class="nav-item">
        <span>Reviews</span>
    </a>
    <a href="/admin/newsletter.html" class="nav-item">
    <span>Newsletter</span>
</a>
</nav>
<div class="sidebar-footer">
    <div class="admin-info">
        <div class="admin-avatar" id="adminInitials">AD</div>
                    <div class="admin-details">
                        <p class="admin-name" id="adminName">Admin User</p>
                        <p class="admin-role">Administrator</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>Add New User</h1>
                <div class="header-actions">
                    <a href="/admin/users.html" class="btn btn-secondary">← Back to Users</a>
                </div>
            </header>

            <!-- Add User Form -->
            <div class="content-section" style="max-width: 600px;">
                <form id="addUserForm">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" placeholder="Enter full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" placeholder="user@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required minlength="6">
                        <small style="color: #666; font-size: 12px; margin-top: 5px; display: block;">Password must be at least 6 characters long</small>
                    </div>

                    <div class="form-group">
                        <label for="role">Role *</label>
                        <select id="role" name="role" required>
                            <option value="user">User (Customer)</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="isActive" name="isActive" checked style="width: auto; margin-right: 8px;">
                            Account is active
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Create User</button>
                        <a href="/admin/users.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
   <script src="config.js"></script>
   <script src="admin-script.js"></script>
<script>
   
    // Set admin name
    const user = JSON.parse(localStorage.getItem('adminUser') || '{}');
    document.getElementById('adminName').textContent = user.name || 'Admin';

    // Handle form submission
    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value,
            isActive: document.getElementById('isActive').checked
        };

        const token = localStorage.getItem('adminToken');

        try {
            const response = await fetch(`${BASE_URL}/api/users`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(formData)
            });

            const data = await response.json();

            if (data.success) {
                showToast('User created successfully!');
                setTimeout(() => {
                    window.location.href = '/admin/users.html';
                }, 1500);
            } else {
                showToast(data.message || 'Failed to create user', 'error');
            }
        } catch (error) {
            console.error('Error creating user:', error);
            showToast('Error creating user', 'error');
        }
    });
</script>

</body>
</html>
